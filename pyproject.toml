[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trick-or-treat-map"
version = "0.1.0"
description = "Turn neighbors' Google Form responses into a shareable trick-or-treat map"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "folium>=0.15",
    "geopy>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trickortreat = "trickortreat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
