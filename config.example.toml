# Copy to config.toml and fill in.

[map]
title = "Elm Street Trick-or-Treat 2026"
# Set to false to show only names/notes in popups, not street addresses.
show_addresses = true
# Night-time look for the map tiles. Set to false for the regular map colors.
dark = true

[geocoding]
# Nominatim (OpenStreetMap) asks for a way to contact you. Required.
contact = "you@example.com"
# Added to addresses that don't already mention the town.
area = "Springfield, IL"
# Holds neighbors' addresses; data/ is git-ignored.
cache = "data/geocache.json"

# Question titles in your Google Form, if you changed them from docs/google-form.md.
# Set consent = "" to skip the consent check.
[columns]
# address = "Street address"
# name = "Name to show on the map"
# notes = "Anything trick-or-treaters should know?"
# teal_pumpkin = "Do you offer non-food or allergy-friendly treats?"
# full_size = "Are you handing out full-size candy bars?"
# consent = "OK to put your house on the shared neighborhood map?"

# Pin addresses the geocoder gets wrong or can't find (right-click a spot in
# Google Maps or openstreetmap.org to copy its coordinates).
[overrides]
# "12 Hidden Ln" = [39.7817, -89.6501]
